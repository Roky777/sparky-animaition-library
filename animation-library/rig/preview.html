<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparky animation pack</title><style>body{margin:0;background:#101217;color:#edf0f6;font:16px system-ui;text-align:center}nav{padding:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}select,button,a{padding:10px;background:#202630;color:inherit;border:1px solid #454c5b;border-radius:8px}canvas{display:block;height:75vh;max-width:100%;object-fit:contain;margin:auto}p{color:#a3adbe}</style><nav><select aria-label="Animation"></select><button id="pause">Pause</button><button id="restart">Replay</button><a href="README.md">Integration guide</a></nav><canvas aria-label="Sparky animation"></canvas><p id="info" role="status">Loading…</p><script type="module">import {SparkyRigPlayer} from './rig-player.js?v=2';try{const rig=await SparkyRigPlayer.load('./manifest.json'),select=document.querySelector('select');let actor,paused=false;for(const clip of rig.manifest.animations){const o=document.createElement('option');o.value=clip.id;o.textContent=clip.title;select.append(o)}const requested=new URLSearchParams(location.search).get('animation');if(rig.manifest.animations.some(c=>c.id===requested))select.value=requested;function load(){actor?.destroy();const clip=rig.manifest.animations.find(c=>c.id===select.value);actor=rig.add(document.querySelector('canvas'),clip.name,{loop:clip.loop});document.querySelector('#info').textContent=clip.kind==='pose'?'Static pose':`${clip.duration.toFixed(2)} seconds · ${clip.loop?'Loop':'One-shot'}`;}select.onchange=load;load();document.querySelector('#pause').onclick=e=>{paused=!paused;rig.setPaused(paused);e.target.textContent=paused?'Play':'Pause'};document.querySelector('#restart').onclick=()=>actor.restart()}catch(e){document.querySelector('#info').textContent=e.message}</script></html>
